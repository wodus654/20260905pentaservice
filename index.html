<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENTA SERVICE</title>
<!-- field service log for MRI engineers -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef7fb; --surface:#ffffff; --surface-2:#e6f3fa; --raise:#ffffff;
  --border:#d2e7f2; --border-strong:#aed2e5;
  --ink:#0e2430; --ink-2:#4c6d7d; --ink-3:#7f9aa8;
  --accent:#0098e0; --accent-ink:#ffffff; --accent-soft:#dcf1fb; --accent-line:#0098e0;
  --ok:#2f7d54; --ok-soft:#dcefe3;
  --warn:#a76a1a; --warn-soft:#f6e9d5;
  --crit:#b23b3b; --crit-soft:#f4e0df;
  --pm:#2f5fa7; --pm-soft:#dfe8f5;
  --acr:#6a4a9c; --acr-soft:#e7dff3;
  --ch:#0f7b8c; --ch-soft:#d5eef1;
  --shadow:0 1px 2px rgba(14,36,48,.06), 0 4px 16px rgba(14,36,48,.05);
  --radius:10px;
  --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1620; --surface:#0f2330; --surface-2:#15303f; --raise:#193849;
    --border:#234459; --border-strong:#2f5a72;
    --ink:#eaf6fc; --ink-2:#a7c7d6; --ink-3:#7096a8;
    --accent:#33c1ff; --accent-ink:#02222f; --accent-soft:#123245; --accent-line:#33c1ff;
    --ok:#5cbd85; --ok-soft:#17361f;
    --warn:#d69b52; --warn-soft:#3a2e1b;
    --crit:#e37e7e; --crit-soft:#3d2222;
    --pm:#7aa2e0; --pm-soft:#1f3350;
    --acr:#ab90d8; --acr-soft:#2c2545;
    --ch:#4bb8c8; --ch-soft:#123840;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1620; --surface:#0f2330; --surface-2:#15303f; --raise:#193849;
  --border:#234459; --border-strong:#2f5a72;
  --ink:#eaf6fc; --ink-2:#a7c7d6; --ink-3:#7096a8;
  --accent:#33c1ff; --accent-ink:#02222f; --accent-soft:#123245; --accent-line:#33c1ff;
  --ok:#5cbd85; --ok-soft:#17361f;
  --warn:#d69b52; --warn-soft:#3a2e1b;
  --crit:#e37e7e; --crit-soft:#3d2222;
  --pm:#7aa2e0; --pm-soft:#1f3350;
  --acr:#ab90d8; --acr-soft:#2c2545;
  --ch:#4bb8c8; --ch-soft:#123840;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
.sidebar{display:none}
.main{min-width:0;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  border-top:3px solid var(--accent);
  display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em}
.topbar .brand svg{display:block}
.brandmark{font-weight:800;letter-spacing:.02em;color:var(--ink)}
.brandmark b{font-weight:800;color:var(--accent)}
.brandlogo{display:block;object-fit:contain;flex:0 0 auto}

/* ---------- login ---------- */
.loginview{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#loginview[hidden]{display:none}
.logincard{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:28px 24px;border-top:3px solid var(--accent)}
.loginbrand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:22px}
.loginbrand .brandmark{font-size:17px}
.loginfield{margin-bottom:12px}
.loginfield label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.loginfield input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px}
.loginfield input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.loginremember{display:flex;align-items:flex-start;gap:8px;margin:14px 0 16px;font-size:13.5px;color:var(--ink)}
.loginremember input{width:17px;height:17px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
.loginremember .hint2{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
.loginerr{color:var(--crit);font-size:13px;margin:-4px 0 12px;min-height:1em}
.loginsubmit{width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.topbar .spacer{flex:1}
.viewhead{padding:18px 16px 6px}
.viewhead h1{font-size:20px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.viewhead .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.wrap{padding:12px 16px 40px;max-width:1000px;margin:0 auto}

/* bottom nav (mobile) */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;color:var(--ink-3);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:500;border-radius:8px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--ink);padding:8px 13px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;
  font-weight:600;letter-spacing:.01em;line-height:1.7;white-space:nowrap}
.chip.pm{background:var(--pm-soft);color:var(--pm)}
.chip.repair{background:var(--crit-soft);color:var(--crit)}
.chip.coldhead{background:var(--ch-soft);color:var(--ch)}
.chip.acr{background:var(--acr-soft);color:var(--acr)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.progress{background:var(--warn-soft);color:var(--warn)}
.chip.revisit{background:var(--crit-soft);color:var(--crit)}
.chip.muted{background:var(--surface-2);color:var(--ink-2)}
.chip.overdue{background:var(--crit-soft);color:var(--crit)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.sample{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--border-strong)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border-strong);
  border-radius:8px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:76px;line-height:1.55}
.field .hint{font-size:12px;color:var(--ink-3);text-transform:none;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--surface);border:0;padding:9px 8px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 44%;border-right:1px solid var(--border)}

/* photo upload */
.photoadd{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--border-strong);background:var(--surface-2);
  color:var(--ink-2);padding:10px 14px;border-radius:9px;font-weight:500;cursor:pointer;align-self:flex-start}
.photoadd:hover{border-color:var(--accent);color:var(--accent)}
.photoadd input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:4px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button.x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;border:0;
  background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer}
.thumb .up{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);font-size:12px}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.confirmov{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.confirmbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:320px;width:100%;box-shadow:var(--shadow)}
.confirmbox p{margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.confirmbtns{display:flex;gap:8px;justify-content:flex-end}
.trashrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.trashrow:last-child{border-bottom:0}
.trashrow .rmeta{margin-top:3px}

.empty{text-align:center;color:var(--ink-2);padding:40px 16px}
.empty svg{opacity:.4;margin-bottom:10px}

/* stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:13px 14px}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.stat.alert .v{color:var(--crit)}
.stat[data-go]:hover,.stat[data-scroll]:hover{border-color:var(--accent-line);background:var(--surface-2)}

/* list rows */
.section-t{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 9px}
.section-t h2{font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--ink-2);text-transform:uppercase}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rmeta{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .rright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.row .rdate{font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1;min-width:150px;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.filters select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}

/* detail */
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.panel .phead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 14px;z-index:2}
.panel .phead h2{font-size:16px;font-weight:600;flex:1;letter-spacing:-.01em}
.panel .pbody{padding:16px;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.formcard{padding:16px;display:flex;flex-direction:column;gap:14px}
.formcard h3{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);font-weight:600}
.kv{display:flex;flex-direction:column;gap:1px}
.kv .kk{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.kv .vv{font-size:15px}
.contactline{margin-top:3px}
.contactline:first-child{margin-top:0}
.linklike{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pmcheckrow{display:flex;align-items:center;gap:9px;cursor:pointer}
.pmcheckrow input{width:19px;height:19px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.pmcheckrow span{font-size:14px;color:var(--ink);font-weight:500}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* systems / acr mini rows */
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.mini:last-child{border-bottom:0}
.mini .mtext{flex:1;min-width:0}
.acrgrid{display:grid;grid-template-columns:1fr;gap:8px}
.acrrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.acrrow:last-child{border-bottom:0}
.acrrow .seg{max-width:180px}
.acrrow .seg button{padding:6px 4px;font-size:12px}

/* PM checklist */
#pmgrid label,#pmgrid span,#pmgrid td,#pmgrid th,
#acrfullgrid label,#acrfullgrid span,#acrfullgrid td,#acrfullgrid th{text-transform:none;letter-spacing:normal}
.pmsection{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
  margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.pmsection:first-child{margin-top:0}
.pmrow{padding:9px 0;border-bottom:1px solid var(--border)}
.pmrow:last-child{border-bottom:0}
.pmhead{display:flex;align-items:baseline;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.pmname{font-weight:500;font-size:14px}
.pmpurpose{font-size:10px;font-weight:600;color:var(--ink-3);border:1px solid var(--border-strong);
  border-radius:4px;padding:0 4px;text-transform:uppercase;letter-spacing:.02em}
.pmctl{display:flex;gap:8px;align-items:center}
.pmctl .seg{flex:0 0 186px;max-width:186px}
.pmctl .seg button{padding:6px 4px;font-size:12px}
.pmctl input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px}
.pmrow.fail .pmname{color:var(--crit)}
.pmfields{display:flex;flex-direction:column;gap:6px}
.pmf{display:flex;align-items:center;gap:10px}
.pmf span{flex:0 0 110px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.pmf input,.pmf select{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px}
.pmf .pmrange{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.pmf .pmrange select{flex:1}
.pmtilde{color:var(--ink-3);font-weight:600}
.pmsuffix{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ink-2)}
.pmf-check{cursor:pointer;justify-content:flex-start;gap:9px}
.pmf-check span{flex:0 0 auto;order:2}
.pmf-check input{flex:0 0 auto;order:1;width:20px;height:20px;margin:0;accent-color:var(--accent)}
@media(max-width:520px){.pmctl{flex-wrap:wrap}.pmctl .seg{flex-basis:100%;max-width:none}}

/* ACR 정밀 */
.acrsec{border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:12px;background:var(--surface)}
.acrsec h4{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.acrsec.acrfail{background:var(--crit-soft);border-color:var(--crit)}
.acrsec.acrfail h4{color:var(--crit)}
.acrsechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acrverdict{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.acrverdict.done{background:var(--ok-soft);color:var(--ok)}
.acrverdict.revisit{background:var(--crit-soft);color:var(--crit)}
.acrverdict.progress{background:var(--warn-soft);color:var(--warn)}
.acrverdict.muted{background:var(--surface-2);color:var(--ink-3);font-weight:500}
.acrsec .crit{font-size:11.5px;color:var(--ink-3);margin:3px 0 8px;line-height:1.45}
.acrmethod{margin:6px 0 8px;padding-left:20px;font-size:12px;color:var(--ink-2);line-height:1.5}
.acrmethod li{margin:2px 0}
.acrfigs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.acrfigs img{max-height:150px;max-width:100%;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:zoom-in;object-fit:contain}
.acrsec .pmf span{flex:0 0 150px}
.acrsec .pmf input[readonly]{background:var(--surface-2);color:var(--ink-2);font-weight:600}
.pmfields.acrcompact{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pmfields.acrcompact .pmf{flex-direction:column;align-items:stretch;gap:2px}
.pmfields.acrcompact .pmf span{flex:none;font-size:10.5px;color:var(--ink-3)}
.pmfields.acrcompact .pmf input{flex:none;padding:6px 8px}
@media(min-width:540px){.pmfields.acrcompact{grid-template-columns:repeat(3,1fr)}}
.pmfields.acrcompact.acr2col{grid-template-columns:1fr 1fr}
.pmfields.acrcompact.acr3col{grid-template-columns:repeat(3,1fr)}
.pmfields.acrcompact.acr4col{grid-template-columns:repeat(4,1fr)}
.pmfields.acrcompact .pmf-check{flex-direction:row;align-items:center;gap:8px}
.pmf.acrcheckrow{flex-wrap:wrap;gap:14px}
.pmfields.acrcompact .acrcheckrow{grid-column:1/-1;flex-direction:row;align-items:center}
.pmfields.acrcompact .pmf-check span{font-size:12px;color:var(--ink-2)}
.acrsec .pmf input.wlfill{background:#ffe066;color:#111;font-weight:700;border-color:#d9a900}
.acrsec .pmf.acrspacer{margin-bottom:14px}
.acrsec .pmf.acrspacertop{margin-top:14px}
.acrsec .pmf-check input{width:19px;height:19px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.acrsec .pmf.acrpair{flex-direction:column;align-items:stretch;gap:3px}
.acrchk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);cursor:pointer}
.acrchk input{width:16px;height:16px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.acrsec .seg{margin-top:8px;max-width:280px}
.acrsec .seg button{padding:6px 4px;font-size:12px}
.acrtablewrap{overflow-x:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px}
table.acrtable{border-collapse:collapse;font-size:12px;min-width:520px;width:100%}
table.acrtable th,table.acrtable td{border:1px solid var(--border);padding:3px 5px;text-align:center}
table.acrtable th{background:var(--surface-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
table.acrtable td:first-child,table.acrtable th:first-child{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--surface-2)}
table.acrtable input{width:52px;border:1px solid transparent;background:transparent;color:var(--ink);font-size:12px;text-align:center;padding:3px 2px;border-radius:4px}
table.acrtable input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.acroverall{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px;border:1px solid var(--accent-line);border-radius:9px;background:var(--accent-soft)}
.acroverall b{color:var(--accent);font-size:13px}
.acroverall.acrfail{background:var(--crit-soft);border-color:var(--crit)}
.acroverall.acrfail b{color:var(--crit)}
.acroverall .seg{max-width:280px;flex:1}

/* 준비물 (prep) */
.prepgroup{border-bottom:1px solid var(--border)}
.prepgroup:last-child{border-bottom:0}
.prepgroup .prephead{padding:11px 14px}
.prepitem{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 30px;font-size:14px;border-top:1px solid var(--border)}
.prepitem:first-of-type{border-top:0}
.prepitem > label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer}
.prepitem input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.prepitem span{flex:1;min-width:0}
.prepitem.done span{text-decoration:line-through;color:var(--ink-3)}
.prepx{flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;padding:2px 8px;cursor:pointer}
.prepx:hover{color:var(--crit)}
.prepadd{display:flex;gap:8px;margin-bottom:6px}
.prepadd input{flex:1;min-width:0;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}

/* 달력 */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead b{font-size:14px;letter-spacing:-.01em}
.calmonthpick{position:relative;display:inline-flex;cursor:pointer}
.calmonthpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calweekdays{margin-bottom:4px}
.calwd{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600;padding:2px 0}
.calcell{height:68px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;
  border:1px solid transparent;border-radius:8px;background:var(--surface-2);cursor:pointer;padding:3px 3px 4px;color:inherit;text-align:left;overflow:hidden}
.calcell.empty{background:transparent;border:0;cursor:default}
.calcell:hover:not(.empty){border-color:var(--accent)}
.calcell.today{background:var(--accent-soft);border-color:var(--accent-line);border-width:2px}
.calcell.today .calnum{color:var(--accent);font-weight:700}
.calnum{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-left:1px}
.caltags{display:flex;flex-direction:column;gap:1px;min-width:0}
.caltag{font-size:9px;line-height:1.3;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caltag.cal-pm{background:var(--warn-soft);color:var(--warn)}
.caltag.cal-acr{background:var(--acr-soft);color:var(--acr)}
.caltag.cal-sched{background:var(--accent-soft);color:var(--accent)}
.caltag.cal-log{background:var(--ok-soft);color:var(--ok)}
.calmore{font-size:9px;color:var(--ink-3);padding-left:3px}
.caldot{width:5px;height:5px;border-radius:999px;display:inline-block;background:var(--ink-3)}
.caldot.cal-pm{background:var(--warn)}
.caldot.cal-acr{background:var(--acr)}
.caldot.cal-sched{background:var(--accent)}
.caldot.cal-log{background:var(--ok)}
.calkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.calkey span{display:inline-flex;align-items:center;gap:5px}

.banner{display:flex;gap:10px;align-items:center;padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;
  display:flex;align-items:center;gap:10px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);pointer-events:auto}
.toastbtn{background:none;border:1px solid currentColor;opacity:.9;color:inherit;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}

@media(min-width:900px){
  .app{grid-template-columns:224px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:2px;padding:16px 10px;border-right:1px solid var(--border);
    border-top:3px solid var(--accent);
    background:var(--surface);position:sticky;top:0;height:100vh}
  .sidebar .sbrand{display:flex;align-items:center;gap:8px;font-weight:600;padding:8px 10px 16px;letter-spacing:-.01em}
  .sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink-2);
    padding:9px 10px;border-radius:8px;font-weight:500;font-size:14px}
  .sidebar nav button svg{width:19px;height:19px}
  .sidebar nav button:hover{background:var(--surface-2);color:var(--ink)}
  .sidebar nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .sidebar .sfoot{margin-top:auto;font-size:11px;color:var(--ink-3);padding:10px}
  .tabbar{display:none}
  .main{padding-bottom:0}
  .topbar{display:none}
  .viewhead{padding:26px 24px 6px}
  .wrap{padding:14px 24px 60px}
  .row{padding:13px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const o = pmOptions(it.name).find(x=>x.v===it.result) || pmOptions(it.name)[0];
  return o;
}
function freshPmState(){
  const out = [];
  PM_FORM.forEach(([section, items]) => items.forEach(([name, purpose, opts]) => {
    const it = { section, name, purpose:purpose||"" };
    if(opts && opts.fields) it.fields = opts.fields.map(f=>
      typeof f === "string"
        ? {label:f, type:"text", value:""}
        : {label:f.label, type:f.type||"text", options:f.options||null, suffix:f.suffix||null, placeholder:f.placeholder||null, value:f.default||""});
    if(opts && opts.noCheck){ it.kind = "fields"; }
    else { it.kind = "check"; it.result = (opts && opts.checkOptions ? opts.checkOptions[0].v : "pass"); it.comment = ""; }
    out.push(it);
  }));
  return out;
}

function acrNum(v){ const n = parseFloat(v); return isFinite(n) ? n : null; }
function acrCalcField(secKey, key, f){
  const g = k => acrNum(f[k]);
  if(secKey==="spa" && (key==="t1peakhalf" || key==="t2peakhalf")){
    const p = g(key==="t1peakhalf" ? "t1peak" : "t2peak");
    if(p!=null) return (p/2).toFixed(1);
    return "";
  }
  if(secKey==="piu" && key==="sighalf"){
    const p = g("siglarge");
    if(p!=null) return (p/2).toFixed(1);
    return "";
  }
  if(secKey==="geo" && (key==="geoww" || key==="geowl")){
    const v = g("geoval");
    if(v==null) return "";
    return key==="geoww" ? String(v) : (v/2).toFixed(1);
  }
  if(secKey==="sta"){
    const pre = key.slice(0,2); // t1 | t2
    if(key==="t1wl" || key==="t2wl"){
      const u = g(pre+"rtop"), lo = g(pre+"rbot");
      if(u!=null && lo!=null) return ((u+lo)/2).toFixed(1);
      return "";
    }
    const t = g(pre+"top"), b = g(pre+"bot");
    if(t!=null && b!=null && (t+b)) return (0.2*(t*b)/(t+b)).toFixed(2);
  }
  if(secKey==="piu"){
    const lo = key==="t1piu"?g("t1low"):g("t2low"), hi = key==="t1piu"?g("t1high"):g("t2high");
    if(lo!=null && hi!=null && (hi+lo)) return (100*(1-(hi-lo)/(hi+lo))).toFixed(2);
  }
  if(secKey==="psg"){
    const L=g("large"),tp=g("top"),bt=g("bot"),lf=g("left"),rt=g("right");
    if([L,tp,bt,lf,rt].every(x=>x!=null) && L) return (Math.abs(((tp+bt)-(lf+rt))/(2*L))*100).toFixed(2);
  }
  return "";
}
// 측정값 → 합격/불합격 자동 판정 ("" = 판정 불가/데이터 부족)
function acrAutoEval(sk, d, piuThr, lcodThr){
  const N = k => acrNum(d[k]);
  const E = 1e-9;
  if(sk==="sag0"){
    const a=d.img1==="Y", b=d.img2==="Y";
    if(!a && !b) return "";
    return (a && b) ? "pass" : "";
  }
  if(sk==="geo"){
    const s=N("sag"), ac=N("axc"), ad=N("axd");
    if([s,ac,ad].every(x=>x==null)) return "";
    const ok = (s==null||Math.abs(s-148)<=2+E)
      && (ac==null||Math.abs(ac-190)<=2+E)
      && (ad==null||Math.abs(ad-190)<=2+E);
    return ok ? "pass" : "fail";
  }
  if(sk==="hcsr"){
    const ks=["img6","img7","img8","img9","img10","img11","img12","img13"];
    if(!ks.some(k=>d[k]==="Y")) return "";
    return ks.every(k=>d[k]==="Y") ? "pass" : "";  // 8매 모두 저장 시 합격, 아니면 미완료(직접 선택 가능)
  }
  if(sk==="sta"){
    const vs=[N("t1thk"),N("t2thk")].filter(v=>v!=null);
    return !vs.length ? "" : (vs.every(v=>Math.abs(v-5.0)<=0.7+E) ? "pass":"fail");
  }
  if(sk==="spa"){
    const vs=["t1s1","t1s11","t2s1","t2s11"].map(N).filter(v=>v!=null);
    return !vs.length ? "" : (vs.every(v=>v<=5+E) ? "pass":"fail");
  }
  if(sk==="piu"){
    const vs=[N("t1piu"),N("t2piu")].filter(v=>v!=null);
    return !vs.length ? "" : (vs.every(v=>v>=(piuThr||87.5)-E) ? "pass":"fail");
  }
  if(sk==="psg"){
    const r=N("ratio");
    return r==null ? "" : (r<=2.5+E ? "pass":"fail");
  }
  if(sk==="lcod"){
    const ks=[]; for(let i=29;i<=44;i++) ks.push("img"+i);
    if(!ks.some(k=>d[k]==="Y")) return "";
    return ks.every(k=>d[k]==="Y") ? "pass" : "";
  }
  return "";
}

// 이미지 축소·압축 → data URI (문서 크기 제한 대비)
function compressImage(file, maxDim, budget){
  maxDim = maxDim || 1400; budget = budget || 200000;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, maxDim/Math.max(w,h));
      w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
      const c = document.createElement("canvas");
      const draw = ()=>{ c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); };
      draw();
      let q = 0.72, data = c.toDataURL("image/jpeg", q), guard = 0;
      while(data.length > budget && q > 0.34){ q -= 0.1; data = c.toDataURL("image/jpeg", q); }
      while(data.length > budget && guard++ < 5){ w = Math.round(w*0.82); h = Math.round(h*0.82); draw(); data = c.toDataURL("image/jpeg", 0.5); }
      resolve({ dataUri:data, w, h });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
    img.src = url;
  });
}

async function saveDoc(coll, obj){
  if(!canEdit()){ toast("보기 전용 계정입니다 — 데이터를 수정할 수 없습니다"); return obj; }
  const now = new Date().toISOString();
  if(!obj.id){ obj = Object.assign({}, obj, {id:uid(), createdAt:now}); }
  obj.updatedAt = now;
  const {id, ...body} = obj;
  // optimistic
  const arr = store[coll];
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr[i] = obj; else arr.push(obj);
  render();
  if(!db){ toast("오프라인 — 이 기기에만 임시 저장됨"); return obj; }
  try { await db.collection(coll).doc(id).set(body); }
  catch(e){ toast("저장 실패: " + (e.message||e.code||"알 수 없는 오류")); }
  return obj;
}
async function deleteDoc(coll, id){
  if(!canEdit()){ toast("보기 전용 계정입니다 — 데이터를 수정할 수 없습니다"); return; }
  store[coll] = store[coll].filter(x=>x.id!==id);
  render();
  if(!db) return;
  try { await db.collection(coll).doc(id).delete(); } catch(e){ toast("삭제 실패: "+(e.message||e.code)); }
}

// 병원명을 ㄱㄴㄷ(가나다)순으로 정렬 — 영문으로 시작하는 이름은 뒤로 보낸다
function koSort(a, b){
  const an = a.name||"", bn = b.name||"";
  const aLatin = /^[A-Za-z]/.test(an), bLatin = /^[A-Za-z]/.test(bn);
  if(aLatin !== bLatin) return aLatin ? 1 : -1;
  return an.localeCompare(bn, "ko");
}
function logsForHospital(id){ return store.logs.filter(l=>l.hospitalId===id && !l.deleted).sort(byDateDesc); }
function byDateDesc(a,b){ return (b.date||"").localeCompare(a.date||"") || (b.createdAt||"").localeCompare(a.createdAt||""); }
function latestLog(hid, pred){
  return store.logs.filter(l=>l.hospitalId===hid && !l.deleted && pred(l)).sort(byDateDesc)[0] || null;
}
function lastPmDate(hid){ const pm = latestLog(hid, l=>l.type==="PM" || l.countsAsPm); return pm ? pm.date : null; }
function lastVisitDate(hid){ const l = latestLog(hid, ()=>true); return l ? l.date : null; }

function nextPmInfo(h){
  const interval = Number(h.pmIntervalMonths)||PM_DEFAULT_MONTHS;
  const last = lastPmDate(h.id);
  const due = h.pmOverride ? h.pmOverride : (last ? addMonths(last, interval) : null);
  return { due, days: due ? relDays(due) : null, interval, last };
}

// ACR: 서류(doc) 매년, 정밀(full) 3년마다. 정밀을 시행한 해에는 서류 생략.
function acrInfo(h){
  const lastFull = latestLog(h.id, l=>l.type==="ACR" && l.acrKind==="full");
  const lastAny  = latestLog(h.id, l=>l.type==="ACR" && l.acrKind!=="pretest"); // 정밀이든 서류든 그 해 서류 요건 충족 (사전TEST는 제외)
  const nextFull = h.acrFullOverride ? h.acrFullOverride
                 : (lastFull ? addMonths(lastFull.date, ACR_KINDS.full.months) : null);
  const nextDoc  = h.acrDocOverride ? h.acrDocOverride
                 : (lastAny ? addMonths(lastAny.date, ACR_KINDS.doc.months) : null);
  // 다음 서류 예정과 다음 정밀 예정이 같은 해 → 그 해엔 정밀만 하면 됨(서류 생략)
  let covered = false;
  if(nextDoc && nextFull){
    const y = s => new Date(s+"T00:00:00").getFullYear();
    covered = y(nextFull) === y(nextDoc);
  }
  return {
    full: { due:nextFull, days: nextFull?relDays(nextFull):null, last:lastFull?lastFull.date:null },
    doc:  { due:nextDoc,  days: nextDoc?relDays(nextDoc):null,  last:lastAny?lastAny.date:null, covered },
  };
}

// 병원의 예정 항목(PM + ACR)을 하나의 목록으로
function upcomingItems(h){
  const out = [];
  const pm = nextPmInfo(h);
  if(pm.due) out.push({ hid:h.id, hname:h.name, kind:"PM", label:"정기점검(PM)", cls:"pm", due:pm.due, days:pm.days });
  const acr = acrInfo(h);
  if(acr.full.due) out.push({ hid:h.id, hname:h.name, kind:"ACR정밀", label:"ACR 정밀", cls:"acr", due:acr.full.due, days:acr.full.days });
  if(acr.doc.due && !acr.doc.covered) out.push({ hid:h.id, hname:h.name, kind:"ACR서류", label:"ACR 서류", cls:"acr", due:acr.doc.due, days:acr.doc.days });
  return out;
}

function calendarHtml(){
  const [y,m] = calMonth.split("-").map(Number); // m: 1-12
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m-1, 1).getDay(); // 0=일
  const dueMap = calendarDueMap();
  const logsMap = {};
  store.logs.filter(l=>!l.deleted && l.date).forEach(l=>{
    const hname = hospById(l.hospitalId)?.name || l.hospitalName || "—";
    (logsMap[l.date] = logsMap[l.date] || new Set()).add(hname);
  });
  const today = todayStr();
  const pad2 = n => String(n).padStart(2,"0");
  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="calcell empty"></div>`;
  const MAXTAGS = 2;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${pad2(m)}-${pad2(d)}`;
    const sched = scheduleForDate(ds);
    const due = dueMap[ds]||[];
    const done = [...(logsMap[ds]||[])];
    const items = [
      ...done.map(name=>({name, cls:"cal-log"})),
      ...due.map(x=>({name:(x.kind==="PM"?"PM·":"ACR·")+x.hname, cls: x.kind==="PM"?"cal-pm":"cal-acr"})),
      ...sched.map(s=>({name:(s.hospitalName||"—")+" (예정)", cls:"cal-sched"})),
    ];
    const shown = items.slice(0,MAXTAGS);
    const extra = items.length - shown.length;
    const tags = shown.map(it=>`<span class="caltag ${it.cls}">${esc(it.name)}</span>`).join("")
      + (extra>0 ? `<span class="calmore">+${extra}건 더</span>` : "");
    cells += `<button type="button" class="calcell${ds===today?" today":""}" data-action="open-day" data-date="${ds}">
      <span class="calnum">${d}</span><div class="caltags">${tags}</div></button>`;
  }
  const trail = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
  for(let i=0;i<trail;i++) cells += `<div class="calcell empty"></div>`;
  return `<div class="card" style="padding:14px" id="cal-swipe">
    <div class="calhead">
      <button type="button" class="btn ghost sm" data-action="cal-prev" aria-label="이전 달">‹</button>

function viewDash(){
  const logs = store.logs.filter(l=>!l.deleted).sort(byDateDesc);
  const now = new Date();
  const mKey = now.toISOString().slice(0,7);
  const thisMonth = logs.filter(l => (l.date||"").slice(0,7)===mKey);
  const openCnt = logs.filter(l => l.status && l.status!=="done").length;
  const WINDOW = 45;
  const due = store.hospitals.flatMap(upcomingItems)
    .filter(x=>x.days!=null && x.days<=WINDOW).sort((a,b)=>a.days-b.days);
  const overdue = due.filter(x=>x.days<0);
  const prepOpen = store.prep.filter(p=>!p.done && !prepStale(p));

function bindCalSwipe(){
  const el = $("#cal-swipe"); if(!el) return;
  let sx=null, sy=null;
  el.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(sx==null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.5) calShift(dx<0 ? 1 : -1);
    sx=null; sy=null;
  }, {passive:true});
}

// 네이티브 confirm()은 Artifact 샌드박스에서 동작하지 않아 자체 확인창 사용
function confirmDialog(msg, onYes, opts){
  const ov = document.createElement("div");
  ov.className = "confirmov";
  ov.innerHTML = `<div class="confirmbox">
    <p>${esc(msg)}</p>
    <div class="confirmbtns">
      <button type="button" class="btn" data-cf="no">취소</button>
      <button type="button" class="btn danger" data-cf="yes">${esc((opts&&opts.yesLabel)||"삭제")}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e=>{
    if(e.target===ov || e.target.closest("[data-cf='no']")){ ov.remove(); return; }
    if(e.target.closest("[data-cf='yes']")){ ov.remove(); onYes(); }
  });
}

function kvBlock(k,v){ return `<div class="kv"><span class="kk">${esc(k)}</span><span class="vv" style="white-space:pre-wrap">${esc(v)}</span></div>`; }
function pmBad(it){ return it.kind!=="fields" && (pmOptions(it.name).find(o=>o.v===it.result)||{}).t==="bad"; }
function pmFieldText(f, sep){
  sep = sep || ": ";
  if(f.type==="check") return f.value ? "✔ " + f.label : "";
  if(f.value==null || String(f.value).trim()==="") return "";
  const v = f.type==="range" ? String(f.value).replace("~"," ~ ") : f.value;
  return f.label + sep + v + (f.suffix ? " " + f.suffix : "");
}
function renderPmDetail(pm){
  const fails = pm.filter(pmBad);
  let html = `<div class="kv"><span class="kk">PM 점검 결과 ${fails.length?`· 이상 ${fails.length}건`:`· 이상 없음`}</span><div style="margin-top:6px">`;
  let lastSec = null;
  pm.forEach(it=>{
    if(it.section!==lastSec){ html += `<div class="pmsection" style="margin-top:10px">${esc(it.section)}</div>`; lastSec = it.section; }
    const fieldStr = (it.fields||[]).map(f=>pmFieldText(f)).filter(Boolean).join(" · ");
    if(it.kind==="fields"){
      html += `<div class="mini"><span class="mtext">${esc(it.name)}</span>
        <span class="mono" style="color:var(--ink-2);font-size:13px">${esc(fieldStr||"—")}</span></div>`;
    } else {
      const o = pmOptions(it.name).find(x=>x.v===it.result) || pmOptions(it.name)[0];
      const extra = [it.comment, fieldStr].filter(Boolean).join(" · ");
      html += `<div class="mini"><span class="mtext">${esc(it.name)}${extra?` <span style="color:var(--ink-3)">— ${esc(extra)}</span>`:""}</span>
        <span class="chip ${pmToneClass(o.t)}">${esc(o.l)}</span></div>`;
    }
  });
  return html + `</div></div>`;
}
function durationMin(a,b){ const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);

function acrEvLabel(v){ return (ACR_EVAL.find(o=>o.v===v)||{}).l || "미평가"; }
function acrEvTone(v){ return pmToneClass((ACR_EVAL.find(o=>o.v===v)||{}).t || "muted"); }

    ${ACR_PULSE_ROWS.map(r=>`<tr><td>${esc(r)}</td>${(af.pulse&&af.pulse[r]||[]).map(v=>`<td>${esc(v||"—")}</td>`).join("")}</tr>`).join("")}

      ${methodHtml(s.method)}
      ${figsHtml(s.figs)}
      <div class="crit">${esc(s.crit)}</div>
      <div class="pmfields${s.compact?" acrcompact":""}${gridCls}">${(()=>{
        const F = s.inputs; let out = ""; let forceBreak = false;
        for(let i=0;i<F.length;i++){
          const [k,label,kind,flag] = F[i];

            if(flag==="group"){
              const run=[F[i]];
              while(F[i+1] && F[i+1][2]==="check" && F[i+1][3]==="group"){ i++; run.push(F[i]); }
              out += run.map((it,ri)=>`<label class="pmf pmf-check"${ri===0?' style="grid-column:1"':""}><input type="checkbox" disabled ${sec[it[0]]?"checked":""}><span>${esc(it[1])}</span></label>`).join("");

            }

              out += `<div class="pmf acrcheckrow">${chkLabel(sec, F[i])}</div>`;
              continue;
            }
            out += `<label class="pmf pmf-check"><input type="checkbox" disabled ${sec[k]?"checked":""}><span>${esc(label)}</span></label>`;
            continue;
          }
          const val = sec[k]||"";
          const hl = (k==="t1wl"||k==="t2wl"||k==="t1peakhalf"||k==="t2peakhalf"||k==="sighalf"||k==="geoww"||k==="geowl") && String(val).trim()!=="";
          const sp = (k==="t1peak"||k==="t1peakhalf"||k==="t2peak"||k==="t2peakhalf") ? " acrspacer" : "";
          const spTop = (k==="t2peak"||k==="t2peakhalf") ? " acrspacertop" : "";
          const brk = (forceBreak || (s.k==="psg" && (k==="top"||k==="left"))) ? ' style="grid-column:1"' : ""; forceBreak = false;
          if(k==="sighalf" || k==="geowl") forceBreak = true;

        return out;
      })()}</div>
      <div class="seg">${ACR_EVAL.map(o=>`<button type="button" disabled class="${sec.eval===o.v?"on":""}">${o.l}</button>`).join("")}</div>

  return h;
}

      if(b.fields) out.fields = b.fields.map(f=>{
        const mf = (m.fields||[]).find(x=>x.label===f.label);
        return { ...f, value: mf ? (mf.value||"") : (f.value||"") };
      });
      if(b.kind==="check"){
        const opts = pmOptions(b.name);
        out.result = opts.some(o=>o.v===m.result) ? m.result : opts[0].v;
        out.comment = m.comment||"";
      }
      return out;
    });
  }
  function pmOpt(o, sel){ return `<option${String(sel)===String(o)?" selected":""}>${esc(o)}</option>`; }
  function pmFieldsHtml(it, i){
    return `<div class="pmfields">${it.fields.map((f,fi)=>{
      let ctl;
      if(f.type==="select")
        ctl = `<select data-pmf="${i}.${fi}"><option value=""></option>${(f.options||[]).map(o=>pmOpt(o,f.value)).join("")}</select>`;
      else if(f.type==="check")
        ctl = `<input type="checkbox" data-pmf="${i}.${fi}" ${f.value?"checked":""}>`;
      else if(f.type==="range"){
        const [lo,hi] = String(f.value||"").split("~");
        ctl = `<span class="pmrange">
          <select data-pmr="${i}.${fi}.0"><option value=""></option>${(f.options||[]).map(o=>pmOpt(o,lo)).join("")}</select>
          <span class="pmtilde">~</span>
          <select data-pmr="${i}.${fi}.1"><option value=""></option>${(f.options||[]).map(o=>pmOpt(o,hi)).join("")}</select></span>`;
      } else
        ctl = `<input type="text" data-pmf="${i}.${fi}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"값")}">`;
      const suf = f.suffix ? `<span class="pmsuffix">${esc(f.suffix)}</span>` : "";
      return `<label class="pmf${f.type==="check"?" pmf-check":""}"><span>${esc(f.label)}</span>${ctl}${suf}</label>`;
    }).join("")}</div>`;
  }
  function renderPm(){
    const box = $("#pmgrid"); if(!box) return;
    let html = "", lastSec = null;
    pmState.forEach((it,i)=>{
      if(it.section!==lastSec){ html += `<div class="pmsection">${esc(it.section)}</div>`; lastSec = it.section; }
      const badge = it.purpose?`<span class="pmpurpose">${esc(it.purpose)}</span>`:"";
      if(it.kind==="fields"){
        html += `<div class="pmrow">
          <div class="pmhead"><span class="pmname">${esc(it.name)}</span>${badge}</div>
          ${pmFieldsHtml(it,i)}
        </div>`;
      } else {
        const opts = pmOptions(it.name);
        const bad = (opts.find(o=>o.v===it.result)||{}).t === "bad";
        html += `<div class="pmrow ${bad?"fail":""}">
          <div class="pmhead"><span class="pmname">${esc(it.name)}</span>${badge}</div>
          <div class="pmctl">
            <div class="seg" data-pm="${i}">
              ${opts.map(o=>`<button type="button" data-r="${o.v}" class="${it.result===o.v?"on":""}">${esc(o.l)}</button>`).join("")}
            </div>
            <input type="text" data-pmc="${i}" value="${esc(it.comment||"")}" placeholder="비고 (측정값 등)">
          </div>
          ${it.fields?`<div style="margin-top:8px">${pmFieldsHtml(it,i)}</div>`:""}
        </div>`;
      }
    });
    box.innerHTML = html;
  }

  // ---- photos ----
  const removedPhotoIds = [];
  let pending = [];
  let photoBusy = 0;
  function renderThumbs(){
    const box = $("#photothumbs"); if(!box) return;
    const ex = editing ? photosForLog(editing.id).filter(p=>!removedPhotoIds.includes(p.id)) : [];
    box.innerHTML =
      ex.map(p=>`<div class="thumb"><img src="${p.dataUri}" data-full="${p.id}" alt="현장 사진"><button type="button" class="x" data-rmphoto="${p.id}" aria-label="삭제">×</button></div>`).join("") +
      pending.map((p,i)=>`<div class="thumb"><img src="${p.dataUri}" data-fullpending="${i}" alt="현장 사진"><button type="button" class="x" data-rmpending="${i}" aria-label="삭제">×</button></div>`).join("") +
      (photoBusy>0?`<div class="thumb"><div class="up">처리 중… ${photoBusy}</div></div>`:"");
  }
  renderThumbs();
  form.addEventListener("change", async e=>{
    const inp = e.target.closest("[data-photoinput]"); if(!inp) return;
    const files = [...inp.files]; inp.value = "";
    for(const f of files){
      if(!/^image\//.test(f.type)) continue;
      photoBusy++; renderThumbs();
      try { const r = await compressImage(f); pending.push(Object.assign({name:f.name}, r)); }
      catch(err){ toast(err.message||"이미지 처리 실패"); }
      photoBusy--; renderThumbs();
    }
  });

  function syncConditional(){
    const type = form.type.value, status = form.status.value, acrKind = form.acrKind.value;
    form.querySelectorAll("[data-when]").forEach(el=> el.style.display = el.dataset.when.split(" ").includes(type) ? "" : "none");
    form.querySelectorAll("[data-when-status]").forEach(el=> el.style.display = el.dataset.whenStatus.split(" ").includes(status) ? "" : "none");
    form.querySelectorAll("[data-when-acr]").forEach(el=> el.style.display = (type==="ACR" && el.dataset.whenAcr.split(" ").includes(acrKind)) ? "" : "none");
  }
  renderAcrFull(); renderPm(); syncConditional();
  updateSysDatalist(form.hospitalId.value);

  function syncPmField(el){
    const [i,fi] = el.dataset.pmf.split(".").map(Number);
    pmState[i].fields[fi].value = el.type==="checkbox" ? (el.checked ? "Y" : "") : el.value;
  }
  function syncPmRange(el){
    const [i,fi,side] = el.dataset.pmr.split(".").map(Number);
    const fld = pmState[i].fields[fi];
    const p = String(fld.value||"").split("~"); p[side] = el.value;
    fld.value = (p[0]||"") + "~" + (p[1]||"");
    if(fld.value==="~") fld.value = "";
  }
  function acrRecalcSection(sk){
    const out = []; const sec = ACR_SECTIONS.find(s=>s.k===sk); if(!sec) return out;
    sec.inputs.forEach(([k,,calc])=>{ if(calc==="calc"){ const v = acrCalcField(sk,k,acrFullState[sk]); acrFullState[sk][k]=v; out.push([k,v]); } });
    return out;
  }
  form.addEventListener("input", e=>{
    const tf = e.target.closest("[data-timefield]");
    if(tf){
      const digits = tf.value.replace(/\D/g,"").slice(0,4);
      tf.value = digits.length > 2 ? digits.slice(0,2) + ":" + digits.slice(2) : digits;
      return; }
    const c = e.target.closest("[data-pmc]");
    if(c){ pmState[+c.dataset.pmc].comment = c.value; return; }
    const rg = e.target.closest("[data-pmr]");
    if(rg){ syncPmRange(rg); return; }
    const f = e.target.closest("[data-pmf]");
    if(f){ syncPmField(f); return; }
    const af = e.target.closest("[data-acrf]");
    if(af){ acrSyncField(af); return; }
    const ap = e.target.closest("[data-acrp]");
    if(ap){ const [r,ci] = ap.dataset.acrp.split("|"); (acrFullState.pulse[r] = acrFullState.pulse[r]||[])[+ci] = ap.value; }
  });
  function acrSyncField(af){
    const [sk,k] = af.dataset.acrf.split("|");
    acrFullState[sk][k] = af.type==="checkbox" ? (af.checked ? "Y" : "") : af.value;
    acrRecalcSection(sk).forEach(([k2,v])=>{ const el = form.querySelector('[data-acrf="'+sk+'|'+k2+'"]');
      if(el && el!==af){ el.value = v; if(k2==="t1wl"||k2==="t2wl"||k2==="t1peakhalf"||k2==="t2peakhalf"||k2==="sighalf"||k2==="geoww"||k2==="geowl") el.classList.toggle("wlfill", String(v).trim()!==""); } });
    acrAutoEvalAll(); acrRefreshEvalUI();
  }
  form.addEventListener("change", e=>{
    const rg = e.target.closest("[data-pmr]");
    if(rg){ syncPmRange(rg); return; }
    const f = e.target.closest("[data-pmf]");
    if(f){ syncPmField(f); return; }
    const af = e.target.closest("[data-acrf]");
    if(af) acrSyncField(af);
  });
  form.addEventListener("click", e=>{
    const pmb = e.target.closest("[data-pm] button");
    if(pmb){ const seg=pmb.closest("[data-pm]"); const i=+seg.dataset.pm;
      pmState[i].result = pmb.dataset.r;
      seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===pmb));
      const bad = (pmOptions(pmState[i].name).find(o=>o.v===pmState[i].result)||{}).t === "bad";
      seg.closest(".pmrow").classList.toggle("fail", bad); return; }
    const seg = e.target.closest("[data-seg] button");
    if(seg){ const wrap=seg.closest("[data-seg]"); wrap.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
      seg.classList.add("on"); form[wrap.dataset.seg].value = seg.dataset.v; syncConditional();
      if(wrap.dataset.seg==="type" || wrap.dataset.seg==="acrKind"){
        const autoTitles = ["정기 예방점검","Planned Maintenance", ...Object.values(ACR_KINDS).map(v=>v.label)];
        if(form.type.value==="PM"){
          if(!form.title.value.trim() || autoTitles.includes(form.title.value.trim()))
            form.title.value = "Planned Maintenance";
        } else if(["REPAIR","COLDHEAD","ACR","ETC"].includes(form.type.value)){
          if(autoTitles.includes(form.title.value.trim())) form.title.value = "";
        }
      }
      return; }
    const ae = e.target.closest("[data-acre] button");
    if(ae){ const sk = ae.closest("[data-acre]").dataset.acre;
      acrManualEval.add(sk); acrFullState[sk].eval = ae.dataset.v;
      const sec = ACR_SECTIONS.find(x=>x.k===sk);
      const allChecks = sec && sec.inputs.every(inp=>inp[2]==="check");
      if(allChecks && (ae.dataset.v==="pass" || ae.dataset.v==="fail")){
        const on = ae.dataset.v==="pass";
        sec.inputs.forEach(([k])=>{ acrFullState[sk][k] = on ? "Y" : ""; });
        renderAcrFull(); return;
      }
      acrAutoEvalAll(); acrRefreshEvalUI(); return; }
    const ao = e.target.closest("[data-acro] button");
    if(ao){ acrManualOverall = true; acrFullState.overall = ao.dataset.v;
      acrRefreshEvalUI(); return; }
    const rmp = e.target.closest("[data-rmphoto]");
    if(rmp){ removedPhotoIds.push(rmp.dataset.rmphoto); renderThumbs(); return; }
    const rmn = e.target.closest("[data-rmpending]");
    if(rmn){ pending.splice(+rmn.dataset.rmpending,1); renderThumbs(); return; }
    const full = e.target.closest("[data-full]");
    if(full){ const p = store.photos.find(x=>x.id===full.dataset.full); if(p) openLightbox(p.dataUri); return; }
    const fullp = e.target.closest("[data-fullpending]");
    if(fullp){ const p = pending[+fullp.dataset.fullpending]; if(p) openLightbox(p.dataUri); return; }
  });
  function updatePrepHint(){
    const box = $("#prepexisting"); if(!box) return;
    const items = prepForHospital(form.hospitalId.value);
    box.textContent = items.length ? "현재 이 병원 준비물: " + items.map(p=>p.text).join(", ") : "";
  }
  function hospSysModel(hid){
    const s = ((hospById(hid)||{}).systems||[])[0];
    if(!s) return "";
    return (s.model||"").trim() + (s.tesla ? " " + s.tesla + "T" : "");
  }
  updatePrepHint();
  if(!editing){
    const m = hospSysModel(form.hospitalId.value); if(m) form.systemModel.value = m;
    if(form.type.value==="PM" && !form.title.value.trim()) form.title.value = "Planned Maintenance";
  }
  form.hospitalId.addEventListener("change", ()=>{
    updateSysDatalist(form.hospitalId.value); updatePrepHint();
    const m = hospSysModel(form.hospitalId.value); if(m) form.systemModel.value = m;
    acrAutoEvalAll(); acrRefreshEvalUI();  // 3T 여부에 따라 PIU·대조도 기준 갱신
  });

  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const obj = editing ? Object.assign({}, editing) : {};
    ["type","acrKind","contractType","hospitalId","date","systemModel","engineer","title","symptom","description","parts","workStart","workEnd","heLevel","status","followUp"]
      .forEach(k=> obj[k] = (fd.get(k)||"").toString().trim());
    if(!obj.hospitalId){ toast("병원을 선택하세요"); return; }
    if(obj.type!=="ACR") obj.acrKind = "";
    if(obj.type!=="PM") obj.contractType = "";
    obj.countsAsPm = (obj.type!=="PM") ? !!fd.get("countsAsPm") : false;
    obj.hospitalName = hospById(obj.hospitalId)?.name || "";
    const tRe = /^([01]?\d|2[0-3]):[0-5]\d$/;
    if(tRe.test(obj.workStart) && tRe.test(obj.workEnd)) obj.durationMin = durationMin(obj.workStart,obj.workEnd);
    else delete obj.durationMin;
    if(obj.type==="ACR"){ acrRecalc(); obj.acrFull = JSON.parse(JSON.stringify(acrFullState)); }
    else obj.acrFull = null;
    obj.acr = [];
    obj.pm = (obj.type==="PM") ? pmState.map(x=>{
      const o = { name:x.name, section:x.section, purpose:x.purpose, kind:x.kind };
      if(x.kind==="check"){ o.result = x.result; o.comment = (x.comment||"").trim(); }
      if(x.fields) o.fields = x.fields.map(f=>{
        const g = { label:f.label, value:(f.value||"").toString().trim() };
        if(f.type && f.type!=="text") g.type = f.type;
        if(f.suffix) g.suffix = f.suffix;
        return g;
      });
      return o;
    }) : [];
    delete obj.sample;
    if(photoBusy>0){ toast("사진 처리가 끝난 뒤 저장하세요"); return; }
    local.set("lastHid", obj.hospitalId);
    if(obj.engineer){ engineer = obj.engineer; local.set("engineer", engineer); }
    const saved = await saveDoc("logs", obj);
    const canPhoto = PHOTO_TYPES.includes(saved.type);
    if(!canPhoto && pending.length) toast("사진은 정기점검·고장수리·Cold Head에만 저장됩니다");
    // 삭제된 기존 사진
    for(const id of removedPhotoIds){
      store.photos = store.photos.filter(x=>x.id!==id);
      if(db){ try{ await db.collection("photos").doc(id).delete(); }catch(e){} }
    }
    // 새 사진
    if(canPhoto && pending.length){
      if(!db){ toast("오프라인 — 사진은 저장되지 않았습니다"); }
      else for(const p of pending){
        const pid = uid();
        const body = { logId:saved.id, name:p.name||"", dataUri:p.dataUri, w:p.w, h:p.h, createdAt:new Date().toISOString() };
        store.photos.push(Object.assign({id:pid}, body));
        try{ await db.collection("photos").doc(pid).set(body); }
        catch(e){ toast("사진 저장 실패: "+(e.message||e.code)); }
      }
    }
    await addPrepItems(obj.hospitalId, fd.get("prepItems"));
    toast(editing ? "저장되었습니다" : "일지가 추가되었습니다");
    closePanel();
  });
}
function updateSysDatalist(hid){
  const h = hospById(hid); const dl = $("#sysmodels"); if(!dl) return;
  dl.innerHTML = ((h&&h.systems)||[]).map(s=>`<option value="${esc(s.model||"")}${s.tesla?" "+s.tesla+"T":""}">`).join("");
}

/* ---- hospital form ---- */
function openHospitalForm(id){
  const editing = id ? hospById(id) : null;
  const h = editing ? Object.assign({}, editing) : { pmIntervalMonths:PM_DEFAULT_MONTHS, systems:[] };
  let systems = (h.systems||[]).map(s=>Object.assign({},s));
  let contacts = contactsList(h).map(c=>Object.assign({},c));

  openPanel(`<form id="hospform" class="card formcard">
    <div class="field"><label>병원명 *</label><input name="name" value="${esc(h.name||"")}" required></div>
    <div class="field"><label>지역</label><input name="region" value="${esc(h.region||"")}" placeholder="예: 대구 수성구"></div>
    <div class="field"><label>담당자</label>
      <div id="contactlist"></div>
      <button type="button" class="btn sm" data-action="add-contact" style="align-self:flex-start;margin-top:8px">${ICONS.plus} 담당자 추가</button>
    </div>
    <div class="field"><label>주소</label><input name="address" value="${esc(h.address||"")}"></div>
    <div class="grid2">
      <div class="field"><label>PM 주기 (개월)</label><input type="number" name="pmIntervalMonths" min="1" value="${esc(h.pmIntervalMonths||PM_DEFAULT_MONTHS)}">
        <span class="hint">기본 2개월. 다음 PM = 최근 PM일 + 주기로 자동 계산</span></div>
      <div class="field"><label>다음 PM 예정일 (수동 지정)</label><input type="date" name="pmOverride" value="${esc(h.pmOverride||"")}">
        <span class="hint">지정 시 자동 계산 대신 이 날짜 사용</span></div>
    </div>
    <div class="grid2">
      <div class="field"><label>다음 ACR 정밀 예정일 (수동)</label><input type="date" name="acrFullOverride" value="${esc(h.acrFullOverride||"")}">
        <span class="hint">비우면 최근 ACR 정밀 + 3년</span></div>
      <div class="field"><label>다음 ACR 서류 예정일 (수동)</label><input type="date" name="acrDocOverride" value="${esc(h.acrDocOverride||"")}">
        <span class="hint">비우면 최근 ACR + 1년</span></div>
    </div>
    <div class="field"><label>메모</label><textarea name="notes" style="min-height:56px">${esc(h.notes||"")}</textarea></div>

    <div class="field"><label>설치 MRI 장비</label>
      <div id="syslist"></div>
      <button type="button" class="btn sm" data-action="add-sys" style="align-self:flex-start;margin-top:8px">${ICONS.plus} 장비 추가</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:4px">
      <button type="submit" class="btn primary" style="flex:1">${editing?"저장":"병원 추가"}</button>
      ${editing?`<button type="button" class="btn danger" data-action="delete-hospital" data-id="${editing.id}">삭제</button>`:""}
      <button type="button" class="btn" data-action="close-panel">취소</button>
    </div>
  </form>`);
  setPanelTitle(editing ? "병원 정보 수정" : "새 병원 등록");

  const form = $("#hospform");
  function renderSys(){
    $("#syslist").innerHTML = systems.length ? systems.map((s,i)=>`<div class="card" style="padding:11px;margin-top:8px">
      <div class="grid2">
        <div class="field"><label>모델</label><input data-s="${i}.model" value="${esc(s.model||"")}" placeholder="예: SIGNA HDxt"></div>
        <div class="field"><label>제조사</label><input data-s="${i}.vendor" value="${esc(s.vendor||"GE")}" placeholder="GE"></div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label>자장 강도 (T)</label><input data-s="${i}.tesla" value="${esc(s.tesla||"")}" placeholder="1.5 / 3.0"></div>
        <div class="field"><label>S/N</label><input data-s="${i}.serial" value="${esc(s.serial||"")}"></div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label>설치일</label><input type="date" data-s="${i}.installDate" value="${esc(s.installDate||"")}"></div>
        <div class="field"><label>Software 버전</label><input data-s="${i}.swVersion" value="${esc(s.swVersion||"")}" placeholder="예: DV26.0"></div>
      </div>
      <div style="margin-top:10px;text-align:right">
        <button type="button" class="btn sm danger" data-action="del-sys" data-i="${i}">이 장비 삭제</button>
      </div>
    </div>`).join("") : `<div class="hint" style="margin-top:6px">등록된 장비 없음</div>`;
  }
  function renderContacts(){
    $("#contactlist").innerHTML = contacts.length ? contacts.map((c,i)=>`<div class="grid2" style="margin-top:8px;align-items:end">
      <div class="field"><label>이름</label><input data-c="${i}.name" value="${esc(c.name||"")}" placeholder="예: 김OO 과장"></div>
      <div class="field"><label>연락처</label><input data-c="${i}.phone" value="${esc(c.phone||"")}" placeholder="010-0000-0000"></div>
      <button type="button" class="btn sm danger" data-action="del-contact" data-i="${i}" style="align-self:end">삭제</button>
    </div>`).join("") : `<div class="hint" style="margin-top:6px">등록된 담당자 없음</div>`;
  }
  renderSys();
  renderContacts();

  form.addEventListener("click", e=>{
    const a = e.target.closest("[data-action]"); if(!a) return;
    if(a.dataset.action==="add-sys"){ systems.push({}); renderSys(); }
    if(a.dataset.action==="del-sys"){ systems.splice(+a.dataset.i,1); renderSys(); }
    if(a.dataset.action==="add-contact"){ contacts.push({}); renderContacts(); }
    if(a.dataset.action==="del-contact"){ contacts.splice(+a.dataset.i,1); renderContacts(); }
  });
  form.addEventListener("input", e=>{
    const t = e.target.closest("[data-s]");
    if(t){ const [i,key] = t.dataset.s.split("."); systems[+i][key] = t.value; return; }
    const c = e.target.closest("[data-c]");
    if(c){ const [i,key] = c.dataset.c.split("."); contacts[+i][key] = c.value; }
  });
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const obj = editing ? Object.assign({}, editing) : {};
    ["name","region","address","notes","pmOverride","acrFullOverride","acrDocOverride"].forEach(k=>obj[k]=(fd.get(k)||"").toString().trim());
    obj.pmIntervalMonths = Number(fd.get("pmIntervalMonths"))||PM_DEFAULT_MONTHS;
    obj.systems = systems.filter(s=>s.model||s.serial||s.vendor||s.swVersion);
    obj.contacts = contacts.filter(c=>c.name||c.phone);
    delete obj.contact;
    if(!obj.name){ toast("병원명을 입력하세요"); return; }
    delete obj.sample;
    await saveDoc("hospitals", obj);
    toast(editing?"저장되었습니다":"병원이 추가되었습니다");
    closePanel();
  });
}

/* ---- settings ---- */
function openSettings(){
  openPanel(`<div class="card formcard">
    <div class="field"><label>로그인 계정</label>

function getUserLabel(){ return "이 기기 설정으로 저장됩니다"; }

/* ---- 달력 하루 상세 ---- */
function openDay(dateStr){
  const sched = scheduleForDate(dateStr);
  const due = calendarDueMap()[dateStr] || [];
  const dayLogs = store.logs.filter(l=>!l.deleted && l.date===dateStr).sort(byDateDesc);
  const hospOpts = store.hospitals.slice().sort(koSort)
    .map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join("");
  openPanel(`
    <div class="card formcard">
      <h3>작성된 일지 (${dayLogs.length})</h3>
      ${dayLogs.length ? `<div class="rows">${dayLogs.map(logRow).join("")}</div>` : `<div class="empty" style="padding:10px 0">이 날짜에 작성된 일지가 없습니다.</div>`}
    </div>
    ${due.length ? `<div class="card formcard">
      <h3>자동 계산된 예정 (PM·ACR)</h3>
      ${due.map(x=>`<div class="mini"><span class="mtext"><span class="chip ${x.cls}">${esc(x.label)}</span> ${esc(x.hname)}</span>
        <button type="button" class="btn sm" data-go="hospital?id=${x.hid}">병원 보기</button></div>`).join("")}
    </div>` : ""}
    <div class="card formcard">
      <h3>등록한 일정</h3>
      ${sched.length ? sched.map(s=>{
        const t = scheduleTypeInfo(s.type);
        return `<div class="mini"><span class="mtext"><span class="chip ${t[2]}">${esc(t[1])}</span> ${esc(s.hospitalName)}${s.note?` — ${esc(s.note)}`:""}</span>
          <button type="button" class="prepx" data-action="del-schedule" data-id="${s.id}" data-date="${dateStr}" aria-label="삭제">×</button></div>`;
      }).join("") : `<div class="empty" style="padding:10px 0">등록된 일정이 없습니다.</div>`}
    </div>
    <form class="card formcard" data-schedule-add="${dateStr}">
      <h3>일정 추가</h3>
      <div class="field"><label>병원</label>
        <select name="hospitalId" required>${store.hospitals.length?"":`<option value="">병원을 먼저 등록하세요</option>`}${hospOpts}</select></div>
      <div class="field"><label>구분</label>
        <select name="type">${SCHEDULE_TYPE_OPTS.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></div>
      <div class="field"><label>메모</label><input name="note" placeholder="예: 오전 방문 예정"></div>
      <button type="submit" class="btn primary">일정 추가</button>
    </form>
  `);
  setPanelTitle(fmtDate(dateStr) + " 일정");
}

/* ---- 휴지통 ---- */
function openTrash(){
  const items = store.logs.filter(l=>l.deleted).sort((a,b)=>(b.deletedAt||"").localeCompare(a.deletedAt||""));
  openPanel(`<div class="card formcard">
    <p style="font-size:12px;color:var(--ink-3);margin:0 0 4px">삭제된 일지는 30일간 보관 후 자동으로 완전 삭제됩니다.</p>
    ${items.length ? `<div>${items.map(l=>{
      const h = hospById(l.hospitalId);
      const daysLeft = Math.max(0, 30 - Math.floor((Date.now()-new Date(l.deletedAt).getTime())/86400000));
      const t = TYPES[l.type]||{label:l.type,cls:"muted"};
      return `<div class="trashrow">
        <div class="rmain"><div class="rtitle">${esc(l.title||typeLabel(l))}</div>
          <div class="rmeta"><span class="chip ${t.cls}">${esc(typeLabel(l))}</span><span>${esc(h?h.name:l.hospitalName||"—")}</span><span class="tnum">${fmtDate(l.date)}</span><span>${daysLeft}일 후 자동삭제</span></div></div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button type="button" class="btn sm" data-action="restore-log" data-id="${l.id}">복구</button>
          <button type="button" class="btn sm danger" data-action="purge-log" data-id="${l.id}">완전삭제</button>
        </div>
      </div>`;
    }).join("")}</div>
    <button type="button" class="btn sm danger" style="margin-top:12px" data-action="empty-trash">휴지통 비우기 (전체 완전삭제)</button>`
      : `<div class="empty">휴지통이 비어 있습니다.</div>` }
  </div>`);
  setPanelTitle(`휴지통 (${items.length})`);
}

/* ============ CSV export ============ */
async function exportCsv(list, name){
  const cols = [
    ["작업일","date"],["병원",l=>hospById(l.hospitalId)?.name||l.hospitalName||""],["장비","systemModel"],
    ["구분",l=>typeLabel(l)],["상태",l=>STATUS[l.status]?.label||l.status||""],
    ["제목","title"],["증상/요청","symptom"],["조치내용","description"],["교체부품","parts"],
    ["담당","engineer"],["소요(분)",l=>l.durationMin??((l.workStart&&l.workEnd)?durationMin(l.workStart,l.workEnd):"")],
    ["헬륨레벨(%)","heLevel"],["후속조치","followUp"],["계약구분","contractType"],
    ["PM주기포함",l=>l.countsAsPm?"Y":""],
    ["PM점검",l=>{ const pm=l.pm||[]; if(!pm.length) return ""; const f=pm.filter(pmBad);
      return f.length ? "이상: "+f.map(x=>x.name+(x.comment?`(${x.comment})`:"")).join(" / ") : "이상 없음"; }],
    ["PM측정값",l=>(l.pm||[]).map(x=>{
      const fv=(x.fields||[]).map(f=>pmFieldText(f,"=")).filter(Boolean).join(", ");
      const parts=[]; if(fv) parts.push(fv); if(x.comment) parts.push(x.comment);
      return parts.length?`${x.name}: ${parts.join(" / ")}`:""; }).filter(Boolean).join(" | ")],
    ["ACR종합",l=> l.acrFull ? acrEvLabel(l.acrFull.overall) : ((l.acr&&l.acr.length)?"(구버전)":"")],
    ["ACR정밀 측정값",l=>{ const af=l.acrFull; if(!af) return "";
      return ACR_SECTIONS.map(s=>{ const sec=af[s.k]||{};
        const v=s.inputs.filter(([k])=>String(sec[k]==null?"":sec[k]).trim()!=="").map(([k,lb])=>`${lb.replace(/^→ /,"")}=${sec[k]}`).join(", ");
        return v?`[${s.t.replace(/^\d+\.\s*/,"").replace(/\s*\(.*\)$/,"")}] ${v}→${acrEvLabel(sec.eval)}`:""; }).filter(Boolean).join(" | "); }],
    ["사진(장)",l=>photosForLog(l.id).length||""],
  ];
  const cell = v => { v = v==null?"":String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows = [cols.map(c=>c[0]).join(",")];
  list.slice().sort(byDateDesc).forEach(l=>{
    rows.push(cols.map(c=> cell(typeof c[1]==="function" ? c[1](l) : l[c[1]])).join(","));
  });
  const csv = "﻿" + rows.join("\r\n");
  let dl = null;
  try { dl = window.claude ? await window.claude.use("downloads") : null; } catch(e){ dl = null; }
  if(!dl){
    toast("이 화면에서는 파일 저장을 지원하지 않습니다");
    return;
  }
  try{
    await dl.save({ filename:`MRI서비스일지_${name||todayStr()}.csv`, data: csv });
    toast("CSV를 저장했습니다");
  }catch(e){
    if(e.code!=="declined") toast("내보내기 실패: "+(e.message||e.code));
  }
}

/* ============ event delegation ============ */
document.addEventListener("click", e=>{
  const lb = e.target.closest("[data-lightbox]");
  if(lb){ const p = store.photos.find(x=>x.id===lb.dataset.lightbox); if(p) openLightbox(p.dataUri); return; }
  const afig = e.target.closest("[data-acrfig]");
  if(afig){ const src = ACR_FIGS[afig.dataset.acrfig]; if(src) openLightbox(src); return; }
  const nav = e.target.closest("[data-nav]");
  if(nav){ go(nav.dataset.nav); return; }
  const goEl = e.target.closest("[data-go]");
  if(goEl){ go(goEl.dataset.go); return; }
  const scrollEl = e.target.closest("[data-scroll]");
  if(scrollEl){ document.getElementById(scrollEl.dataset.scroll)?.scrollIntoView({behavior:"auto", block:"start"}); return; }
  const a = e.target.closest("[data-action]");
  if(!a) return;
  const act = a.dataset.action;
  const id = a.dataset.id;
  if(MUTATING_ACTIONS.has(act) && !canEdit()){ toast("보기 전용 계정입니다 — 데이터를 수정할 수 없습니다"); return; }
  if(act==="call-tel"){ e.preventDefault(); window.open("tel:"+a.dataset.tel, "_blank"); return; }
  if(act==="close-panel") return closePanel();
  if(act==="settings") return openSettings();
  if(act==="logout"){ closePanel(); logout(); return; }
  if(act==="new-log") return openLogForm(null, a.dataset.hid);
  if(act==="open-log") return openLogDetail(id);
  if(act==="edit-log"){ closePanelSoft(); return openLogForm(id); }
  if(act==="delete-log"){
    confirmDialog("이 일지를 휴지통으로 이동할까요? 30일간 보관 후 자동 삭제됩니다.", ()=>{ trashLog(id); closePanel(); toast("휴지통으로 이동됨"); }, {yesLabel:"휴지통으로 이동"});
    return; }
  if(act==="new-hospital") return openHospitalForm(null);
  if(act==="edit-hospital") return openHospitalForm(id);
  if(act==="delete-hospital"){
    confirmDialog("이 병원과 관련 설정을 삭제할까요? (작업일지는 남습니다)", ()=>{ deleteDoc("hospitals", id); closePanel(); });
    return; }
  if(act==="export"){ const list = currentLogList(); return exportCsv(list); }
  if(act==="export-all") return exportCsv(store.logs.filter(l=>!l.deleted), "전체");
  if(act==="clear-samples"){ confirmDialog("예시 병원·일지를 모두 삭제할까요?", clearSamples); return; }
  if(act==="open-trash") return openTrash();
  if(act==="restore-log"){ restoreLog(id); toast("복구되었습니다"); openTrash(); return; }
  if(act==="purge-log"){
    confirmDialog("이 일지를 완전히 삭제할까요? 되돌릴 수 없습니다.", ()=>{ purgeLog(id); openTrash(); }, {yesLabel:"완전삭제"});
    return; }
  if(act==="empty-trash"){
    confirmDialog("휴지통의 모든 일지를 완전히 삭제할까요? 되돌릴 수 없습니다.", emptyTrash, {yesLabel:"완전삭제"});
    return; }
  if(act==="prep-done"){ const p = store.prep.find(x=>x.id===id); if(!p) return;
    const nowDone = !p.done;
    saveDoc("prep", Object.assign({}, p, {done:nowDone, doneAt:nowDone?new Date().toISOString():""}));
    if(nowDone) toast("‘"+p.text+"’ 챙김 완료", {label:"실행취소", fn:()=> saveDoc("prep", Object.assign({}, p, {done:false, doneAt:""}))});
    return; }
  if(act==="prep-del"){ const p = store.prep.find(x=>x.id===id);
    deleteDoc("prep", id);
    if(p) toast("‘"+p.text+"’ 삭제됨", {label:"실행취소", fn:()=> saveDoc("prep", p)});
    return; }
  if(act==="cal-prev"||act==="cal-next"||act==="cal-today"){
    if(act==="cal-today") calShift("today"); else calShift(act==="cal-next"?1:-1);
    return; }
  if(act==="open-day") return openDay(a.dataset.date);
  if(act==="del-schedule"){ delSchedule(id); openDay(a.dataset.date); return; }
});
document.addEventListener("change", e=>{
  const mj = e.target.closest("[data-cal-jump]");
  if(mj && mj.value){ calMonth = mj.value; render(); }
});
document.addEventListener("submit", e=>{
  const pf = e.target.closest("[data-prep-add]");
  if(pf){ e.preventDefault();
    if(!canEdit()){ toast("보기 전용 계정입니다 — 데이터를 수정할 수 없습니다"); return; }
    const inp = pf.querySelector('[name="prepText"]');

function closePanelSoft(){ panelRoot().innerHTML=""; document.body.style.overflow=""; }
function currentLogList(){
  const q = parseHash().q;
  let list = store.logs.filter(l=>!l.deleted);
  if(q.hid) list = list.filter(l=>l.hospitalId===q.hid);
  if(q.type) list = list.filter(l=>l.type===q.type);
  if(q.status==="open") list = list.filter(l=>l.status && l.status!=="done");
  else if(q.status) list = list.filter(l=>l.status===q.status);
  const term=(q.s||"").toLowerCase();
  if(term) list = list.filter(l => (`${l.title} ${l.description} ${l.parts} ${l.symptom}`).toLowerCase().includes(term));
  return list;
}

// filters (search/select) -> update hash query
document.addEventListener("input", e=>{
  const f = e.target.closest("[data-filter]");
  if(!f) return;
  clearTimeout(document._ft);
  document._ft = setTimeout(()=>{
    const base = parseHash();
    const q = Object.assign({}, base.q);
    const v = f.value.trim();
    if(v) q[f.dataset.filter]=v; else delete q[f.dataset.filter];
    const qs = new URLSearchParams(q).toString();
    history.replaceState(null,"", "#/"+base.path+(qs?"?"+qs:""));
    // re-render list body only for search to keep focus
    if(f.type==="search"){ renderListKeepFocus(f); } else { render(); }
  }, f.type==="search"?200:0);
});
function renderListKeepFocus(input){
  const val = input.value, pos = input.selectionStart;
  render();
  const again = document.querySelector(`[data-filter="${input.dataset.filter}"]`);
  if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
}

window.addEventListener("hashchange", ()=>{ closePanelSoft(); render(); });
window.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  const lb = document.querySelector(".lightbox");
  if(lb){ lb.remove(); return; }
  if(panelRoot().innerHTML) closePanel();
});

/* ============ boot ============ */
location.hash = "/dash";
render();
initDb();
setInterval(()=>{ pruneDonePrep(); pruneTrash(); if(parseHash().path==="dash") render(); }, 60000);

})();
